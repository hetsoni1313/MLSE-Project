name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src/ gateway/ evaluation/ tests/ --output-format=github

      - name: Format check
        run: |
          ruff format --check src/ gateway/ evaluation/ tests/

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short

      - name: Run routing tests
        run: |
          pytest tests/routing/ -v --tb=short

      - name: Run resilience tests
        run: |
          pytest tests/resilience/ -v --tb=short

      - name: Run all tests with coverage
        run: |
          pytest tests/ -v --tb=short --cov=src/llmops_governance --cov-report=term-missing || true

      - name: Validate configs
        run: |
          python -c "import yaml; [yaml.safe_load(open(f'configs/{c}.yaml')) for c in ['default','routing','thresholds','pricing','model','logging']]"

