# Fine-tuning configuration for Banking77 intent classification
# Base model: Qwen/Qwen2.5-1.5B-Instruct
# Method: QLoRA with PEFT/TRL

model:
  name: "Qwen/Qwen2.5-1.5B-Instruct"
  fallback: "meta-llama/Llama-3.2-1B-Instruct"
  fallback_small: "Qwen/Qwen2.5-0.5B-Instruct"

finetuning:
  method: "QLoRA"
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

training:
  learning_rate: 0.0002
  epochs: 2
  max_sequence_length: 512
  per_device_batch_size: 4
  gradient_accumulation_steps: 4
  warmup_ratio: 0.05
  weight_decay: 0.01
  seed: 42
  fp16: true
  logging_steps: 50
  eval_steps: 200
  save_steps: 200

quantization:
  bits: 4
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

dataset:
  name: "PolyAI/banking77"
  max_train_samples: null
  validation_size: 500
  seed: 42

mlflow:
  experiment_name: "banking77-finetuning"
  tracking_uri: "./mlruns"

output:
  model_dir: "./training_output"
  merged_dir: "./merged_model"

